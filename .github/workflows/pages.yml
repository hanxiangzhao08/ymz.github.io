name: Build and deploy DWBE title screening site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          root = Path('payload')
          parts = {
              name: (root / name).read_text().strip()
              for name in [
                  'part_00.txt', 'part_01.txt',
                  'fix_02a.txt', 'fix_02b.txt',
                  'part_03.txt', 'part_04.txt',
                  'fix_05a.txt', 'fix_05b.txt',
                  'part_06.txt',
              ]
          }
          # The connector dropped one reviewed base64 character while writing fix_05a.
          if len(parts['fix_05a.txt']) == 3249:
              parts['fix_05a.txt'] = parts['fix_05a.txt'][:300] + 'e' + parts['fix_05a.txt'][300:]

          order = [
              'part_00.txt', 'part_01.txt',
              'fix_02a.txt', 'fix_02b.txt',
              'part_03.txt', 'part_04.txt',
              'fix_05a.txt', 'fix_05b.txt',
              'part_06.txt',
          ]
          encoded = ''.join(parts[name] for name in order)
          expected_encoded = '9c0f5f52c60dce04b8df447201fa2f8fba13f254f77e2b6e5f980b32bbb213a3'
          actual_encoded = hashlib.sha256(encoded.encode()).hexdigest()
          assert actual_encoded == expected_encoded, (actual_encoded, expected_encoded, len(encoded))

          archive = base64.b64decode(encoded, validate=True)
          expected_archive = 'dd5f798c664f099cd0a15911cdc48522b3fff0988e7e458ba005f2e9a71e1b84'
          actual_archive = hashlib.sha256(archive).hexdigest()
          assert actual_archive == expected_archive, (actual_archive, expected_archive)
          Path('/tmp/dwbe-source.tgz').write_bytes(archive)
          with tarfile.open('/tmp/dwbe-source.tgz', 'r:gz') as tf:
              tf.extractall('.')
          print(f'Restored verified source archive: {len(archive)} bytes')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalogue synchronizer
        run: python sync_hazardous.py --self-test

      - name: Build verified 2,833-record hazardous catalogue
        run: python sync_hazardous.py

      - name: Vendor SheetJS browser library
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output vendor/xlsx.full.min.js

      - name: Build static site
        run: python build_site.py

      - name: Add category compliance dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          payload_dir = Path('category-dashboard-payload')
          parts = sorted(payload_dir.glob('part_*'))
          assert parts, 'Category dashboard payload is missing'

          encoded = ''.join(part.read_text().strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          expected = '8459fc75fadeb8396c8b74a4198ad2452e550c791710b58f9a45bf134901bdae'
          actual = hashlib.sha256(archive).hexdigest()
          assert actual == expected, (actual, expected)

          archive_path = Path('/tmp/category-dashboard.tar.gz')
          archive_path.write_bytes(archive)
          with tarfile.open(archive_path, 'r:gz') as tf:
              tf.extractall('site', filter='data')

          assert Path('site/category-dashboard/index.html').is_file()
          print(f'Added category dashboard: {len(archive)} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
