name: Build and deploy DWBE title screening site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          root = Path('payload')
          p0 = (root / 'part_00.txt').read_text().strip()
          p1 = (root / 'part_01.txt').read_text().strip()
          # part_02 was committed with trailing duplicated text; only the reviewed 6,500-byte prefix is valid.
          p2 = (root / 'part_02.txt').read_text().strip()[:6500]
          p3 = (root / 'part_03.txt').read_text().strip()
          p4 = (root / 'part_04.txt').read_text().strip()
          p5 = (root / 'part_05.txt').read_text().strip()
          # One base64 character was dropped while committing part_05; restore the reviewed character.
          if len(p5) == 6499:
              p5 = p5[:300] + 'e' + p5[300:]
          p6 = (root / 'part_06.txt').read_text().strip()

          encoded = p0 + p1 + p2 + p3 + p4 + p5 + p6
          expected_encoded = '9c0f5f52c60dce04b8df447201fa2f8fba13f254f77e2b6e5f980b32bbb213a3'
          actual_encoded = hashlib.sha256(encoded.encode()).hexdigest()
          assert actual_encoded == expected_encoded, (actual_encoded, expected_encoded, len(encoded))

          archive = base64.b64decode(encoded)
          expected_archive = 'dd5f798c664f099cd0a15911cdc48522b3fff0988e7e458ba005f2e9a71e1b84'
          actual_archive = hashlib.sha256(archive).hexdigest()
          assert actual_archive == expected_archive, (actual_archive, expected_archive)
          Path('/tmp/dwbe-source.tgz').write_bytes(archive)
          with tarfile.open('/tmp/dwbe-source.tgz', 'r:gz') as tf:
              tf.extractall('.')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalogue synchronizer
        run: python sync_hazardous.py --self-test

      - name: Build verified 2,833-record hazardous catalogue
        run: python sync_hazardous.py

      - name: Vendor SheetJS browser library
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output vendor/xlsx.full.min.js

      - name: Build static site
        run: python build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
