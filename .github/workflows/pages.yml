name: Build and deploy DWBE title screening site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore reviewed source payload
        shell: bash
        run: |
          cat payload/part_*.txt | tr -d '\r\n' | base64 --decode > /tmp/dwbe-source.tgz
          echo "dd5f798c664f099cd0a15911cdc48522b3fff0988e7e458ba005f2e9a71e1b84  /tmp/dwbe-source.tgz" | sha256sum --check --strict
          tar -xzf /tmp/dwbe-source.tgz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalogue synchronizer
        run: python sync_hazardous.py --self-test

      - name: Build verified 2,833-record hazardous catalogue
        run: python sync_hazardous.py

      - name: Vendor SheetJS browser library
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output vendor/xlsx.full.min.js

      - name: Build static site
        run: python build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
