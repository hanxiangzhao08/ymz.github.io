name: Build and deploy DWBE title screening site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, tarfile

          root = Path('payload')
          names = [
              'part_00.txt', 'part_01.txt',
              'fix_02a.txt', 'fix_02b.txt',
              'part_03.txt', 'part_04.txt',
              'fix_05a.txt', 'fix_05b.txt',
              'part_06.txt',
          ]
          encoded = ''.join((root / name).read_text().strip() for name in names)
          archive = base64.b64decode(encoded, validate=True)
          Path('/tmp/dwbe-source.tgz').write_bytes(archive)
          with tarfile.open('/tmp/dwbe-source.tgz', 'r:gz') as tf:
              tf.extractall('.')
          print(f'Restored source archive: {len(archive)} bytes')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalogue synchronizer
        run: python sync_hazardous.py --self-test

      - name: Build verified 2,833-record hazardous catalogue
        run: python sync_hazardous.py

      - name: Vendor SheetJS browser library
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output vendor/xlsx.full.min.js

      - name: Build static site
        run: python build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
